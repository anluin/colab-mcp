[project]
name = "colab-mcp"
version = "0.1.0"
description = "Cross-platform MCP server for agent-driven Google Colab compute"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Colab MCP contributors" }]
keywords = ["colab", "gpu", "mcp", "jupyter", "agents"]
dependencies = [
  "google-colab-cli==0.6.0",
  "mcp>=1.29,<2",
  "pydantic-settings<2.15",
]

[project.scripts]
colab-mcp = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
  "build>=1.2",
  "mypy>=1.15",
  "pytest>=9.0",
  "ruff>=0.15",
  "twine>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
